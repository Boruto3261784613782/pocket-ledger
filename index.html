<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FBF5EC">
<meta name="description" content="小云账本 · 一只住在手机里的记账小云">
<title>小云账本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小云账本">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-bowl" viewBox="0 0 24 24">
      <path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8Z"/>
      <path d="M9.5 7.5c0-1.2 1-1.6 1-2.6M13.5 7.5c0-1.2 1-1.6 1-2.6"/>
    </symbol>
    <symbol id="i-bus" viewBox="0 0 24 24">
      <rect x="4.5" y="4" width="15" height="13" rx="4"/>
      <path d="M4.5 10.5h15M8 17v2.5M16 17v2.5"/>
      <circle cx="9" cy="13.5" r=".9"/><circle cx="15" cy="13.5" r=".9"/>
    </symbol>
    <symbol id="i-bag" viewBox="0 0 24 24">
      <path d="M5.8 8.5h12.4l1 11.2a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L5.8 8.5Z"/>
      <path d="M9 8.5V6.8a3 3 0 0 1 6 0v1.7"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="m12 4.2 2.3 4.7 5.2.8-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.8L12 4.2Z"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="m4 11.2 8-6.8 8 6.8"/>
      <path d="M6.4 10v9.4h11.2V10"/>
      <path d="M10 19.4v-4.6h4v4.6"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path d="M12 19.5S4.6 15 4.6 10.3A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.4 2.7c0 4.7-7.4 9.2-7.4 9.2Z"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M4.5 4.8h5.2a2.3 2.3 0 0 1 2.3 2.3v12.4a2.6 2.6 0 0 0-2.6-2.6H4.5V4.8Z"/>
      <path d="M19.5 4.8h-5.2a2.3 2.3 0 0 0-2.3 2.3v12.4a2.6 2.6 0 0 1 2.6-2.6h4.9V4.8Z"/>
    </symbol>
    <symbol id="i-gift" viewBox="0 0 24 24">
      <rect x="4" y="9.5" width="16" height="10.5" rx="2.4"/>
      <path d="M4 13.6h16M12 9.5V20"/>
      <path d="M12 9.5C10.2 6.4 7 6 7 8.1s2.4 1.4 5 1.4 5 .7 5-1.4-3.2-1.7-5 1.4Z"/>
    </symbol>
    <symbol id="i-dots" viewBox="0 0 24 24">
      <circle cx="6.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="17.5" cy="12" r="1.6"/>
    </symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24">
      <rect x="3.5" y="6" width="17" height="13" rx="3.2"/>
      <path d="M3.5 10.2h17"/>
      <circle cx="16.6" cy="14.8" r="1.2"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
      <path d="M4.5 5v14h15"/>
      <path d="M8.5 15.5v-3.4M12 15.5V8.6M15.5 15.5v-2.2"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11"/>
      <circle cx="4.8" cy="6.5" r="1"/><circle cx="4.8" cy="12" r="1"/><circle cx="4.8" cy="17.5" r="1"/>
    </symbol>
    <symbol id="i-pie" viewBox="0 0 24 24">
      <circle cx="11" cy="12" r="7.5"/>
      <path d="M11 4.5V12h7.5"/>
    </symbol>
    <symbol id="i-me" viewBox="0 0 24 24">
      <circle cx="12" cy="8.2" r="3.6"/>
      <path d="M5 20c0-3.9 3.2-6.1 7-6.1s7 2.2 7 6.1"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5.5v13M5.5 12h13"/>
    </symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9.5 7V4.9h5V7M6.5 7l1 13h9l1-13"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 4.5v10.2m0 0 3.6-3.6M12 14.7 8.4 11.1"/>
      <path d="M4.8 19.5h14.4"/>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M12 15V4.8m0 0L8.4 8.4M12 4.8l3.6 3.6"/>
      <path d="M4.8 19.5h14.4"/>
    </symbol>
    <symbol id="i-backspace" viewBox="0 0 24 24">
      <path d="M9.2 5.6h9.1A1.7 1.7 0 0 1 20 7.3v9.4a1.7 1.7 0 0 1-1.7 1.7H9.2L3.6 12l5.6-6.4Z"/>
      <path d="m11.6 9.6 4.8 4.8M16.4 9.6l-4.8 4.8"/>
    </symbol>
  </defs>
</svg>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">小云账本</span>
    </div>
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth" aria-label="上个月"><svg><use href="#i-left"/></svg></button>
      <button class="month-pill" id="monthPill">2026年10月</button>
      <button class="icon-btn" id="nextMonth" aria-label="下个月"><svg><use href="#i-right"/></svg></button>
    </div>
  </header>

  <main class="views">

    <!-- 首页 -->
    <section class="view is-active" data-view="home">
      <div class="hello">
        <div class="mascot" id="mascot">
          <svg viewBox="0 0 92 64" aria-hidden="true">
            <path class="cloud" d="M22 54C12.6 54 5 47.6 5 39.6c0-6.6 4.6-12.2 11-13.6C17.4 16.4 25.4 9.6 35 9.6c8.2 0 15.2 4.8 17.8 11.8 1-.3 2.2-.4 3.2-.4 6.4 0 11.6 4.9 11.6 11 0 .9-.1 1.8-.4 2.6 4 1.4 6.8 5 6.8 9.4 0 5.4-4.6 9.8-10.2 9.8H22Z"/>
            <ellipse class="blush" cx="29" cy="43" rx="5" ry="3"/>
            <ellipse class="blush" cx="63" cy="43" rx="5" ry="3"/>
            <circle class="eye" cx="35" cy="37" r="2.6"/>
            <circle class="eye" cx="57" cy="37" r="2.6"/>
            <path class="smile" d="M42 44c1.8 2.2 6.2 2.2 8 0"/>
          </svg>
        </div>
        <div class="hello-text">
          <p class="hello-hi" id="greeting">你好呀</p>
          <p class="hello-sub" id="greetingSub">今天也记一笔吧</p>
        </div>
      </div>

      <div class="card overview">
        <div class="ov-top">
          <span class="ov-label">这月花了</span>
          <span class="ov-count" id="entryCount">0 笔</span>
        </div>
        <div class="ov-amount"><span class="yen">¥</span><span id="ovExpense">0.00</span></div>
        <div class="ov-split">
          <div><span class="k">收入</span><b id="ovIncome">¥0.00</b></div>
          <div><span class="k">结余</span><b id="ovBalance">¥0.00</b></div>
        </div>
        <div class="budget" id="budgetBox" hidden>
          <div class="budget-row"><span id="budgetText">还没有设置预算</span><span id="budgetPct">0%</span></div>
          <div class="budget-bar"><i id="budgetFill"></i></div>
        </div>
      </div>

      <div class="section-head">
        <h2>最近记的</h2>
        <button class="link" data-goto="list">全部<svg><use href="#i-right"/></svg></button>
      </div>
      <div id="recentList" class="entries"></div>
    </section>

    <!-- 明细 -->
    <section class="view" data-view="list">
      <div class="chips" id="typeFilter">
        <button class="chip is-on" data-filter="all">全部</button>
        <button class="chip" data-filter="expense">支出</button>
        <button class="chip" data-filter="income">收入</button>
      </div>
      <div class="month-summary" id="monthSummary"></div>
      <div id="monthList" class="entries"></div>
    </section>

    <!-- 统计 -->
    <section class="view" data-view="stats">
      <div class="card donut-card">
        <div class="card-title">这月支出分布</div>
        <div class="donut-wrap">
          <svg class="donut" viewBox="0 0 140 140" id="donut"></svg>
          <div class="donut-center">
            <span class="donut-label">合计</span>
            <b id="donutTotal">¥0</b>
          </div>
        </div>
        <div class="legend" id="donutLegend"></div>
      </div>

      <div class="card">
        <div class="card-title">近 7 天</div>
        <div class="bars" id="weekBars"></div>
      </div>

      <div class="card">
        <div class="card-title">分类排行</div>
        <div class="rank" id="rankList"></div>
      </div>
    </section>

    <!-- 我的 -->
    <section class="view" data-view="me">
      <div class="card">
        <div class="card-title">每月预算</div>
        <div class="budget-edit">
          <span class="yen">¥</span>
          <input id="budgetInput" inputmode="decimal" placeholder="0" autocomplete="off">
          <button class="mini-btn" id="saveBudget">保存</button>
        </div>
        <p class="hint">设一个整数就好，超了我会轻轻提醒你。</p>
      </div>

      <div class="card">
        <div class="card-title">数据</div>
        <button class="row-btn" id="exportBtn">
          <svg><use href="#i-download"/></svg><span>导出备份</span><em>JSON</em>
        </button>
        <button class="row-btn" id="importBtn">
          <svg><use href="#i-upload"/></svg><span>导入备份</span><em>覆盖</em>
        </button>
        <input type="file" id="importFile" accept="application/json" hidden>
        <button class="row-btn danger" id="clearBtn">
          <svg><use href="#i-trash"/></svg><span>清空所有记录</span>
        </button>
      </div>

      <div class="card about">
        <div class="about-logo">
          <svg viewBox="0 0 92 64" aria-hidden="true"><path d="M22 54C12.6 54 5 47.6 5 39.6c0-6.6 4.6-12.2 11-13.6C17.4 16.4 25.4 9.6 35 9.6c8.2 0 15.2 4.8 17.8 11.8 1-.3 2.2-.4 3.2-.4 6.4 0 11.6 4.9 11.6 11 0 .9-.1 1.8-.4 2.6 4 1.4 6.8 5 6.8 9.4 0 5.4-4.6 9.8-10.2 9.8H22Z"/></svg>
        </div>
        <p><b>小云账本</b> v1.0</p>
        <p class="hint">数据只存在这台设备上，不上传、不联网。<br>换手机前记得导出备份呀。</p>
      </div>
    </section>

  </main>

  <button class="fab" id="fab" aria-label="记一笔"><svg><use href="#i-plus"/></svg></button>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-on" data-tab="home"><svg><use href="#i-home"/></svg><span>首页</span></button>
    <button class="tab" data-tab="list"><svg><use href="#i-list"/></svg><span>明细</span></button>
    <button class="tab" data-tab="stats"><svg><use href="#i-pie"/></svg><span>统计</span></button>
    <button class="tab" data-tab="me"><svg><use href="#i-me"/></svg><span>我的</span></button>
  </nav>

</div>

<!-- 记账弹层 -->
<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="记一笔">
    <div class="grab"></div>
    <div class="sheet-head">
      <div class="type-toggle" id="typeToggle">
        <button class="type-btn is-on" data-type="expense">支出</button>
        <button class="type-btn" data-type="income">收入</button>
      </div>
      <button class="del-btn" id="deleteBtn" hidden aria-label="删除"><svg><use href="#i-trash"/></svg></button>
    </div>

    <div class="amount-display">
      <span class="yen">¥</span><span id="amountText">0.00</span>
    </div>

    <div class="cats" id="catRow"></div>

    <div class="meta-row">
      <input type="date" id="dateInput" aria-label="日期">
      <input type="text" id="noteInput" placeholder="写点什么…" maxlength="30" autocomplete="off">
    </div>

    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k=".">.</button><button data-k="0">0</button><button data-k="del" class="del" aria-label="退格"><svg><use href="#i-backspace"/></svg></button>
    </div>

    <button class="save-btn" id="saveBtn">记下这笔</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
